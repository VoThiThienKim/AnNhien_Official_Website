services:
  postgres:
    image: postgres:16-alpine
    container_name: an-nhien-postgres
    environment:
      POSTGRES_USER: annhien
      POSTGRES_PASSWORD: annhien
      POSTGRES_DB: annhien
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: an-nhien-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:

